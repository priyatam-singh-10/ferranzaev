<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Set the directory index
    DirectoryIndex index.php index.html

    # Main directory configuration
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Handle Laravel routing
        <IfModule mod_rewrite.c>
            RewriteEngine On
            
            # Redirect Trailing Slashes If Not A Folder...
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_URI} (.+)/$
            RewriteRule ^ %1 [L,R=301]
            
            # Handle Front Controller...
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ index.php [L]
        </IfModule>
    </Directory>

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        
        # Trust proxy headers for HTTPS detection
        SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    </IfModule>

    # Disable access to sensitive directories
    <Directory /var/www/html/core/storage>
        Require all denied
    </Directory>

    <Directory /var/www/html/core/bootstrap/cache>
        Require all denied
    </Directory>

    <Directory /var/www/html/core/config>
        Require all denied
    </Directory>

    <Directory /var/www/html/core/database>
        Require all denied
    </Directory>

    # Enable compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Browser caching
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType application/pdf "access plus 1 month"
        ExpiresByType text/x-javascript "access plus 1 month"
    </IfModule>

    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    # Log level for debugging
    LogLevel warn
    
    # PHP error logging
    php_flag display_errors on
    php_flag log_errors on
    php_value error_log ${APACHE_LOG_DIR}/php_errors.log
</VirtualHost>
